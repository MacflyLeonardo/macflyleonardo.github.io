        // --- SECTION 1: LOADING SCREEN ---
        function LoadingScreen({ onComplete }) {
            const [count, setCount] = useState(0);
            const [wordIndex, setWordIndex] = useState(0);
            const words = ["Смысл", "Форма", "Эстетика"];

            useEffect(() => {
                let startTime = null;
                const duration = 2700;
                let rafId;

                const step = (timestamp) => {
                    if (!startTime) startTime = timestamp;
                    const elapsed = timestamp - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const current = Math.floor(progress * 100);
                    setCount(current);

                    if (progress < 1) {
                        rafId = requestAnimationFrame(step);
                    } else {
                        setTimeout(() => {
                            onComplete();
                        }, 400);
                    }
                };

                rafId = requestAnimationFrame(step);
                return () => cancelAnimationFrame(rafId);
            }, [onComplete]);

            useEffect(() => {
                const interval = setInterval(() => {
                    setWordIndex((prev) => (prev + 1) % words.length);
                }, 900);
                return () => clearInterval(interval);
            }, []);

            return (
                <motion.div
                    initial={{ opacity: 1 }}
                    exit={{ opacity: 0, transition: { duration: 0.65, ease: [0.22, 1, 0.36, 1] } }}
                    className="fixed inset-0 z-[9999] bg-bg flex flex-col justify-between p-6 md:p-12 select-none"

                            className="text-xs text-muted uppercase tracking-[0.3em]"

                    </div>

        // --- HLS VIDEO BACKGROUND ---
        function HlsVideo({ src, flipped = false }) {
            const videoRef = useRef(null);

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                let hls;
                if (window.Hls && window.Hls.isSupported()) {
                    hls = new window.Hls({ enableWorker: true });
                    hls.loadSource(src);
                    hls.attachMedia(video);
                    hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(() => {});
                    });
                } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                    video.src = src;
                    video.addEventListener("loadedmetadata", () => {
                        video.play().catch(() => {});
                    });
                }

                return () => {
                    if (hls) hls.destroy();
                };
            }, [src]);

            return (
                <video
                    ref={videoRef}
                    autoPlay
                    muted
                    loop
                    playsInline
                    className={`absolute top-1/2 left-1/2 min-w-full min-h-full object-cover -translate-x-1/2 -translate-y-1/2 pointer-events-none ${
                        flipped ? "scale-y-[-1]" : ""
                    }`}
                />
            );
        }

        // --- INTERACTIVE MODALS ---

                        </motion.div>

                    {/* Journal Modal */}
                    {selectedJournal && (
                        <motion.div
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            exit={{ opacity: 0 }}
                            onClick={onCloseJournal}
                            className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4 md:p-8"
                        >
                            <motion.div
                                initial={{ y: 30, opacity: 0 }}
                                animate={{ y: 0, opacity: 1 }}
                                exit={{ y: 20, opacity: 0 }}
                                onClick={(e) => e.stopPropagation()}
                                className="w-full max-w-2xl bg-surface border border-stroke rounded-3xl p-6 md:p-10 shadow-2xl"
                            >

                                    <button
                                        onClick={onCloseJournal}
                                        className="w-9 h-9 rounded-full bg-bg border border-stroke text-text-primary flex items-center justify-center"
                                    >
                                        ✕
                                    </button>
                                </div>
                                <h3 className="text-3xl md:text-4xl font-display italic text-text-primary mb-4">
                                    {selectedJournal.title}
                                </h3>
                                <p className="text-sm md:text-base text-muted leading-relaxed mb-6">

                                    className="w-full h-56 object-cover rounded-2xl border border-stroke"

                        </motion.div>

                    {/* Exploration Lightbox */}
                    {selectedExploration && (
                        <motion.div

                            animate={{ opacity: 1 }}
                            exit={{ opacity: 0 }}
                            onClick={onCloseExploration}

                        >
                            <motion.div
                                initial={{ scale: 0.9, opacity: 0 }}
                                animate={{ scale: 1, opacity: 1 }}
                                exit={{ scale: 0.9, opacity: 0 }}
                                onClick={(e) => e.stopPropagation()}
                                className="relative max-w-lg w-full bg-surface border border-stroke rounded-3xl overflow-hidden p-4"
                            >
                                <img
                                    src={selectedExploration.img}
                                    alt={selectedExploration.title}

                                <div className="flex items-center justify-between pt-4 px-2">
                                    <div>

                    {/* Studio Info / Resume Modal */}
                    {resumeOpen && (
                        <motion.div
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            exit={{ opacity: 0 }}
                            onClick={onCloseResume}
                            className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4"

                                            </p>
                                        </div>
                                        <span className="text-xs text-[#89AACC] whitespace-nowrap">02</span>

                                    <div className="p-4 rounded-2xl bg-bg border border-stroke flex justify-between items-start gap-4">
                                        <div>
                                            <p className="font-medium text-text-primary">
                                                Многостраничные издания и типографика
                                            </p>
                                            <p className="text-xs text-muted mt-1">

            );

        // --- MAIN APP (Index.tsx) ---
        function App() {
            const [isLoading, setIsLoading] = useState(true);
            const [activeSection, setActiveSection] = useState("home");
            const [selectedProject, setSelectedProject] = useState(null);
            const [selectedJournal, setSelectedJournal] = useState(null);
            const [selectedExploration, setSelectedExploration] = useState(null);
            const [resumeOpen, setResumeOpen] = useState(false);

            const handleNavigate = (id) => {
                setActiveSection(id);
                const el = document.getElementById(id);
                if (el) {
                    el.scrollIntoView({ behavior: "smooth" });
                }
            };

            useEffect(() => {
                const sections = ["home", "work", "journal", "contact"];
                const onScroll = () => {
                    const scrollPos = window.scrollY + 300;
                    for (const sectionId of sections) {
                        const el = document.getElementById(sectionId);
                        if (el) {
                            const top = el.offsetTop;
                            const height = el.offsetHeight;
                            if (scrollPos >= top && scrollPos < top + height) {
                                setActiveSection(sectionId === "journal" ? "work" : sectionId);
                                break;
                            }
                        }
                    }
                };
                window.addEventListener("scroll", onScroll, { passive: true });
                return () => window.removeEventListener("scroll", onScroll);
            }, []);

            return (
                <div className="min-h-screen bg-bg text-text-primary relative">
                    <AnimatePresence mode="wait">
                        {isLoading && (
                            <LoadingScreen onComplete={() => setIsLoading(false)} />
                        )}
                    </AnimatePresence>

                    <Navbar
                        activeSection={activeSection}
                        onNavigate={handleNavigate}
                        onOpenResume={() => setResumeOpen(true)}
                    />

                    <main>
                        <HeroSection
                            isLoaded={!isLoading}
                            onNavigate={handleNavigate}
                        />
                        <SelectedWorksSection
                            onSelectProject={(project) => setSelectedProject(project)}
                        />
                        <JournalSection
                            onSelectEntry={(entry) => setSelectedJournal(entry)}
                        />
                        <ExplorationsSection
                            onSelectExploration={(item) => setSelectedExploration(item)}
                        />
                        <StatsSection />
                        <ContactFooterSection />
                    </main>

                    <Modals
                        selectedProject={selectedProject}
                        onCloseProject={() => setSelectedProject(null)}
                        selectedJournal={selectedJournal}
                        onCloseJournal={() => setSelectedJournal(null)}
                        selectedExploration={selectedExploration}
                        onCloseExploration={() => setSelectedExploration(null)}
                        resumeOpen={resumeOpen}
                        onCloseResume={() => setResumeOpen(false)}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
